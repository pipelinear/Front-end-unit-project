<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plan - Panda</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function(){
            // cross out when checked
            $("input[type='checkbox']").change(function(){
                if(this.checked) {
                    $(this).parent().css("text-decoration", "line-through");
                    $(this).parent().css("color", "gray");
                } else {
                    $(this).parent().css("text-decoration", "none");
                    $(this).parent().css("color", "inherit");
                }
            });
        });
    </script>
</head>
<body>
    <main class="page-card">
        <h1>Your Plan</h1>
        <a href="index.html">Back to Home</a>
        <p>Here is your auto-generated to-do list. Check items off as you complete them!</p>
        
        <!-- To-Do List -->
        <div style="font-size: 18px;">
            <label><input type="checkbox"> Read history chapter 4</label><br><br>
            <label><input type="checkbox"> Math worksheet</label><br><br>
            <label><input type="checkbox"> Science lab report</label>
        </div>
    </main>
</body>
</html>
